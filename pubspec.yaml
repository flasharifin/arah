name: arah
description: "Arah — aplikasi keuangan pribadi dengan AI assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  intl: ^0.20.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Sumber ikon dibuat dari assets/images/arah-logo.png; regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#143F35"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0 # foreground sudah diberi padding safe zone
